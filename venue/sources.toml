kernel-only (licensing boundary, paper Multi-asset research): rows enter only deterministic code; no CME field or
metadata reaches a language model beyond the permitted reports. Nothing is inspected beyond integrity until a class
annex is frozen.

The terms as read, the CME texts from the human's browser downloads in `data/terms/` (gitignored), with their SHA-256:
- Databento User Agreement (effective 2024-01-31): third-party data under the providers' terms (§1.5); "Customer may
  no longer download, access, or use any Third-Party Data" after termination (§9.3(i)).
- Databento Exchange Data Policy (2025-04-08): CME data more than 8 hours old is historical, outside the real-time
  restrictions; it defers to CME's Schedule 5.
- CME Schedule 5 to the Information License Agreement, version 5.04 (January 2026; `schedule-5-to-the-ila-january-2026.pdf`,
  cfbea9ebe97d774e22841ee767875ad4b7279ea97088977a05612cdc010d249a): §7.1(c), the notice a licensee's public website
  must display, prohibits use of "Information (including associated metadata) in any manner for any machine learning
  and/or artificial intelligence [...] to generate any information, material, data, derived works, content, or output".
- CME notice DS-45 (June 2026; `market-data-license-agreement-updates-june-2026.pdf`,
  1de4ebbb2b3495395eff929a26b99b027eadabbd3287fdf0ce92005638ccb83e): that clarification belongs to the website-display
  updates (effective 2027-01-01); the other updates (effective 2026-09-17) limit use "only for its internal business
  purposes" and prohibit synthetic feeds. The updated Subscriber Addendum, which governs a subscriber receiving data
  through a distributor, is not among these texts.
The human's reading (licensing boundary, 2026-10-26): kernel-only use, rows never reaching a language model, is
internal deterministic processing, not the AI use these clauses prohibit; no permission request is made.
"""

