[fed-ddp]
description = """
# Federal Reserve Board Data Download Program (certified 2026-10-26; human request of 2026-10-26)

Preformatted packages and whole-release SDMX files of H.15 (selected interest rates), H.10/G.5 (exchange rates),
G.17 (industrial production), Z.1 (financial accounts) and policy rates, fetched only through the program's
`Output.aspx` "direct download for automated systems" URLs (`venue/sources/datalayer.json`, feeds `fed-ddp-*`). The
package identifiers were read once from each release's `Choose.aspx` page on 2026-10-26; the pages themselves are
