[hyperliquid-archive]
description = '''
# Hyperliquid's requester-pays S3 archives (surveyed 2026-10-26; nothing fetched beyond the survey)

Read with the AWS account the human configured (IAM user `hyperliquid-data`, S3 read-only, us-east-1, a $20 monthly
budget that denies the user at 100%; spending approved up to $20 in total).

- `s3://hyperliquid-archive/market_data/<YYYYMMDD>/<hour>/l2Book/<COIN>.lz4`: one file per coin and UTC hour, from
  2023-04-15 to the day before the survey (1,266 dates). Each holds JSON lines `{"time", "ver_num", "raw": {"channel":
  "l2Book", "data": {"coin", "time", "levels"}}}`, the same `l2Book` record our recorder polls, with 20 levels a side.
  BTC on 2026-10-20 hour 0: 668 snapshots, a median of 5.4 s apart (at most 5.6 s), 250 KB compressed and 1.1 MB
  raw. Coins listed at hour 12: 13 on 2023-04-15 (of U: BTC, ETH, SOL, BNB), 134 on 2024-06-01 and 198 on 2025-06-01
  (all 12 of U). One hour of every coin is 5 MB (2023), 43 MB (2024) and 89 MB (2025) compressed.
- `s3://hyperliquid-archive/asset_ctxs/<YYYYMMDD>.csv.lz4`: one file a day, 2.6 to 5.5 MB.
- `s3://hyperliquid-archive/Testnet/`, and `s3://hl-mainnet-node-data/` with `node_fills`, `node_fills_by_block`,
  `node_trades`, `misc_events_by_block`, `explorer_blocks` and `replica_cmds`, each split by hour.

Cost (requester pays, us-east-1 to the internet): about $0.09 per GB transferred and $0.0004 per 1,000 GETs. The
12 coins of U for one hour a day over the whole archive is about 15,000 files and 2 GB, about $0.20; every hour of
every day for U is about 55 GB, about $5.

Hyperliquid's documentation offers the archive publicly; downloads are within the human's approved $20, and the
human approved the C0.7 regime diagnostic and stage 3's archive cost table on 2026-10-26.'''

