[package]
name = "mm"
version = "0.1.0"
edition = "2021"

[dependencies]
parquet = { version = "60.0.0", default-features = false, features = ["zstd", "snap"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.1"
