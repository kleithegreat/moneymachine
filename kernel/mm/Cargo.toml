[package]
name = "mm"
version = "0.1.0"
edition = "2021"

[dependencies]
egg = "0.11.0"
arrow-array = "=60.0.0"
arrow-ipc = "=60.0.0"
arrow-schema = "=60.0.0"
base64 = "0.22"
bytes = "1"
parquet = { version = "60.0.0", default-features = false, features = ["zstd", "snap", "arrow"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.1"
